<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 DELTA VIP KEY HUB</title>
    <style>
        /* Modern Premium Dark Design */
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #151518;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #ff6400; /* Neon Oranje VIP Rand */
            box-shadow: 0 8px 24px rgba(255, 100, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #8c8c96;
            margin-bottom: 25px;
        }

        /* Key Systeem Kaarten */
        .key-box {
            background-color: #1c1c22;
            border: 1px solid #2d2d35;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }

        .key-title {
            font-size: 12px;
            color: #ff6400;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f0f12;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #25252b;
        }

        .key-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }

        .copy-btn {
            background-color: #ff6400;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .copy-btn:hover {
            background-color: #e05300;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copy-btn.success {
            background-color: #2ecc71;
        }

        /* Footer info */
        .footer {
            font-size: 11px;
            color: #5c5c64;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👑 DELTA VIP KEY HUB</h1>
        <div class="subtitle">Kopieer hieronder je actieve toegangssleutel</div>

        <!-- 🔑 KEY 1: HOOFD KEY -->
        <div class="key-box">
            <div class="key-title">Main Script Key (Actief)</div>
            <div class="key-row">
                <span class="key-text" id="key1">DeltaVIP2026</span>
                <button class="copy-btn" onclick="copyKey('key1', this)">KOPIEER</button>
            </div>
        </div>

        <!-- 🔑 KEY 2: EXTRA OF ALTERNATIEVE KEY -->
        <div class="key-box">
            <div class="key-title">Backup / Alternatieve Key</div>
            <div class="key-row">
                <span class="key-text" id="key2">LootLabsVIP</span>
                <button class="copy-btn" onclick="copyKey('key2', this)">KOPIEER</button>
            </div>
        </div>

        <div class="footer">
            Powered by GitHub Pages & LootLabs © 2026
        </div>
    </div>

    <script>
        // JavaScript functie om de keys feilloos te kopiëren
        function copyKey(elementId, button) {
            var keyText = document.getElementById(elementId).innerText;
            
            // Gebruik de moderne Clipboard API
            navigator.clipboard.writeText(keyText).then(function() {
                // Verander knop naar groen en succes-tekst
                button.innerText = "GEKOPIEERD! ✔️";
                button.classList.add("success");
                
                // Zet na 2 seconden de knop weer normaal
                setTimeout(function() {
                    button.innerText = "KOPIEER";
                    button.classList.remove("success");
                }, 2000);
            }).catch(function(err) {
                alert("Kopiëren mislukt, selecteer de tekst handmatig.");
            });
        }
    </script>

</body>
</html>
